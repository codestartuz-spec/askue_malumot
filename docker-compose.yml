# ASKUE ma'lumot — to'liq tizim: MySQL + API + Worker (+ Cloudflare Tunnel).
# Ishga tushirish:  bash deploy.sh        (yoki)  docker compose up -d --build
name: askue

x-app: &app
  image: askue-app:latest
  restart: unless-stopped
  environment: &appenv
    TZ: ${TZ:-Asia/Tashkent}
    DATABASE_URL: mysql+pymysql://askue:${MYSQL_PASSWORD}@mysql:3306/askue?charset=utf8mb4
    SECRET_KEY: ${SECRET_KEY}
    TOKEN_HOURS: ${TOKEN_HOURS:-12}
    SADMIN_USERNAME: ${SADMIN_USERNAME:-sadmin}
    SADMIN_PASSWORD: ${SADMIN_PASSWORD}
    TELEGRAM_API: ${TELEGRAM_API:-https://api.telegram.org}
    TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
  volumes:
    - askue_data:/app/backend/data
  logging: &log
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tashkent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: askue
      MYSQL_USER: askue
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=${INNODB_BUFFER_POOL:-512M}
      - --default-time-zone=+05:00
    volumes:
      - askue_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *log

  api:
    <<: *app
    build: .
    depends_on:
      mysql: { condition: service_healthy }
    # Standart holda faqat serverning o'zidan (127.0.0.1) ochiq — internetga Cloudflare Tunnel chiqaradi.
    # Tunnelsiz, tarmoqdan kirish kerak bo'lsa .env da API_BIND=0.0.0.0 qiling.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    depends_on:
      mysql: { condition: service_healthy }
      api: { condition: service_healthy }

  # Cloudflare Tunnel (global tarmoqqa chiqarish). CLOUDFLARE_TUNNEL_TOKEN kiritilsa deploy.sh o'zi yoqadi.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api: { condition: service_healthy }
    logging: *log

volumes:
  askue_mysql:
  askue_data:
